name: ab
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "base git ref in Layr-Labs/flock-challenge-multi"
        required: true
      cand_ref:
        description: "candidate git ref in Layr-Labs/flock-challenge-multi"
        required: true
      groups:
        description: "A/B groups (paired runs)"
        required: false
        default: "6"
      runs:
        description: "measured trials per arm"
        required: false
        default: "12"
      warmup:
        description: "warm-up trials per arm"
        required: false
        default: "2"
      log2:
        description: "log2 batch size"
        required: false
        default: "18"

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout base tree
        uses: actions/checkout@v4
        with:
          repository: Layr-Labs/flock-challenge-multi
          ref: ${{ inputs.base_ref }}
          path: base
      - name: Checkout candidate tree
        uses: actions/checkout@v4
        with:
          repository: Layr-Labs/flock-challenge-multi
          ref: ${{ inputs.cand_ref }}
          path: cand
      - name: Install bc and python
        run: sudo apt-get update && sudo apt-get install -y bc
      - name: Run paired A/B
        timeout-minutes: 90
        env:
          BASE_REF: ${{ inputs.base_ref }}
          CAND_REF: ${{ inputs.cand_ref }}
          GROUPS: ${{ inputs.groups }}
          RUNS: ${{ inputs.runs }}
          WARMUP: ${{ inputs.warmup }}
          LOG2: ${{ inputs.log2 }}
        run: |
          sudo chmod +x ab.sh
          bash ab.sh
